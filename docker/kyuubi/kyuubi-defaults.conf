kyuubi.authentication=KERBEROS
kyuubi.kinit.principal=kyuubi/kyuubi.test.local@TEST.LOCAL
kyuubi.kinit.keytab=/shared/kyuubi.keytab
kyuubi.engine.type=SPARK_SQL
kyuubi.engine.share.level=CONNECTION

# REST is enabled only for the application's server-side session telemetry;
# the browser never reaches it directly and Kyuubi UI is not proxied.
kyuubi.frontend.protocols=THRIFT_BINARY,REST
kyuubi.frontend.rest.bind.host=0.0.0.0
kyuubi.frontend.rest.bind.port=10099
kyuubi.spnego.principal=HTTP/kyuubi.test.local@TEST.LOCAL
kyuubi.spnego.keytab=/shared/HTTP-kyuubi.test.local.keytab

spark.master=local[*]
# The per-engine Spark UI stays off. Engines here are short-lived, so finished
# applications are read from the history server instead.
spark.ui.enabled=false

# Every engine records its history in Ozone, where the history server reads it.
spark.eventLog.enabled=true
spark.eventLog.dir=ofs://ozone.test.local/spark/eventlogs
spark.eventLog.compress=false
