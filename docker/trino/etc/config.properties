coordinator=true
node-scheduler.include-coordinator=true
http-server.authentication.type=KERBEROS
# Port 8080 is not published by Compose. It is used only by the coordinator's
# internal node services; clients still use Kerberos-protected HTTPS on 8443.
http-server.authentication.allow-insecure-over-http=true
http-server.authentication.krb5.service-name=HTTP
http-server.authentication.krb5.principal-hostname=trino.test.local
http-server.authentication.krb5.keytab=/shared/trino.keytab
http-server.authentication.krb5.user-mapping.pattern=(.*)@TEST.LOCAL
http.authentication.krb5.config=/shared/krb5.conf
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/tls/trino.p12
http-server.https.keystore.key=changeit
http-server.https.truststore.path=/tls/truststore.p12
http-server.https.truststore.key=changeit
internal-communication.shared-secret=kudos-test-trino-internal-communication-secret-2026
node.internal-address-source=FQDN
discovery.uri=https://trino.test.local:8443
