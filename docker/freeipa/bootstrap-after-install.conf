[Service]
# systemd does not propagate Docker service environment to ExecStartPost.
# These are deliberately non-secret credentials for the disposable test realm.
Environment="IPA_ADMIN_INITIAL_PASSWORD=K8SparkAdmin2026Secure!"
Environment="IPA_DM_PASSWORD=DirectoryManager1"
Environment="IPA_TEST_PASSWORD=K8SparkAdmin2026Secure!"
ExecStartPost=/usr/local/sbin/bootstrap-test-identities
