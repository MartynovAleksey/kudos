name: kudos-test

services:
  freeipa:
    build: ./docker/freeipa
    hostname: freeipa.test.local
    # Keep systemd alive when a reusable test volume needs an upgrade; the
    # upstream image otherwise powers off before dependent services can report
    # the actual FreeIPA unit error.
    command: ["no-exit"]
    # FreeIPA runs systemd and needs a writable cgroup hierarchy.  Do not use
    # privileged: the upstream image explicitly does not support that mode.
    cgroup: host
    environment:
      IPA_SERVER_HOSTNAME: freeipa.test.local
      IPA_SERVER_INSTALL_OPTS: >-
        -U --realm=TEST.LOCAL --domain=test.local --hostname=freeipa.test.local
        --no-ntp -p DirectoryManager1 -a KudosAdmin2026Secure!
      IPA_DM_PASSWORD: DirectoryManager1
      IPA_ADMIN_INITIAL_PASSWORD: KudosAdmin2026Secure!
      IPA_TEST_PASSWORD: KudosAdmin2026Secure!
      IPA_ANALYST_PASSWORD: KudosAnalyst2026Secure!
    # Docker Desktop tmpfs lacks POSIX ACL support, while 389 Directory Server
    # uses setfacl under /run. Docker-managed ext4 volumes provide it.
    volumes:
      - freeipa-data:/data
      - kerberos-shared:/shared
      # Holds only the application's TLS material and krb5.conf, never a keytab.
      - app-secrets:/app-secrets
      - hue-secrets:/hue-secrets
      - freeipa-run:/run
      - freeipa-tmp:/tmp
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "389:389"
      - "636:636"
      - "88:88/udp"
      - "88:88"
      - "464:464/udp"
      - "464:464"
    networks:
      default:
        aliases:
          - freeipa.test.local
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          systemctl is-active --quiet bootstrap-test-identities.service
          && test -f /shared/HTTP-sparkhistory.test.local.keytab
          && test -f /shared/trino.keytab
          && test -s /shared/app-tls.p12
          && kinit -kt /shared/admin.keytab admin@TEST.LOCAL
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 90s

  kyuubi:
    build:
      context: ./docker
      dockerfile: kyuubi/Dockerfile
    platform: linux/amd64
    hostname: kyuubi.test.local
    depends_on:
      freeipa:
        condition: service_healthy
      # Engines write their event logs to Ozone from the first query onwards.
      ozone:
        condition: service_healthy
      flink-jobmanager:
        condition: service_healthy
    volumes:
      - kerberos-shared:/shared:ro
    ports:
      - "10009:10009"
      # Kyuubi's built-in web UI and REST API.
      - "10099:10099"
    networks:
      default:
        aliases:
          - kyuubi.test.local
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /shared/kyuubi.keytab
          && bash -c ': > /dev/tcp/kyuubi.test.local/10009'
          && bash -c ': > /dev/tcp/kyuubi.test.local/10099'
      interval: 10s
      timeout: 5s
      retries: 18

  hdfs:
    build: ./docker/hdfs
    # Apache Hadoop 3.4.2 publishes the image used by this test stack for
    # amd64; Docker Desktop emulates it on Apple Silicon.
    platform: linux/amd64
    hostname: hdfs.test.local
    depends_on:
      freeipa:
        condition: service_healthy
    volumes:
      - kerberos-shared:/shared:ro
      - hdfs-data:/data
    ports:
      - "9870:9870"
      # DataNode data-transfer and HTTP ports, so WebHDFS OPEN/CREATE redirects
      # (which point at dfs.datanode.http.address=hdfs.test.local:1006) are
      # reachable from a client outside the compose network (e.g. the k8s pod).
      - "1004:1004"
      - "1006:1006"
    networks:
      default:
        aliases:
          - hdfs.test.local
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -r /shared/nn-hdfs.test.local.keytab
          && ps -ef
          | grep -q '[o]rg.apache.hadoop.hdfs.server.datanode.DataNode'
          && bash -c ': > /dev/tcp/hdfs.test.local/9870'
      interval: 10s
      timeout: 5s
      retries: 30

  hbase:
    build: ./docker/hbase
    hostname: hbase.test.local
    depends_on:
      freeipa:
        condition: service_healthy
    volumes:
      - kerberos-shared:/shared:ro
      - hbase-data:/data
    ports:
      - "8080:8080"
      - "16010:16010"
    networks:
      default:
        aliases:
          - hbase.test.local
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ps -ef
          | grep -q '[o]rg.apache.hadoop.hbase.master.HMaster'
          && ps -ef
          | grep -q '[o]rg.apache.hadoop.hbase.regionserver.HRegionServer'
          && export KRB5_CONFIG=/shared/krb5.conf
          && kinit -kt /shared/hbase-hbase.test.local.keytab hbase/hbase.test.local@TEST.LOCAL
          && curl --fail --silent --noproxy '*' --connect-timeout 3 --max-time 8
          --negotiate -u : http://hbase.test.local:8080/ >/dev/null
      interval: 10s
      timeout: 15s
      retries: 30

  ozone:
    build: ./docker/ozone
    hostname: ozone.test.local
    depends_on:
      freeipa:
        condition: service_healthy
    volumes:
      - kerberos-shared:/shared:ro
      - ozone-data:/data
    ports:
      - "9862:9862"
      - "9874:9874"
      # SCM client port and the DataNode client I/O ports (standalone gRPC + Ratis)
      # so an ofs:// client outside compose can read/write blocks. The datanode is
      # advertised as ozone.test.local.
      - "9860:9860"
      - "9859:9859"
      - "9858:9858"
    networks:
      default:
        aliases:
          - ozone.test.local
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ps -ef
          | grep -q '[o]rg.apache.hadoop.hdds.scm.server.StorageContainerManagerStarter'
          && ps -ef
          | grep -q '[o]rg.apache.hadoop.ozone.om.OzoneManagerStarter'
          && ps -ef
          | grep -q '[o]rg.apache.hadoop.ozone.HddsDatanodeService'
          && test -f /data/ozone/.eventlogs-ready
          && bash -c ': > /dev/tcp/ozone.test.local/9862'
      interval: 10s
      timeout: 5s
      retries: 30

  spark-history:
    build:
      context: ./docker
      dockerfile: spark-history/Dockerfile
    # apache/spark:4.1.0 is multi-architecture, so this one runs natively on
    # both Intel and Apple Silicon instead of through emulation.
    hostname: sparkhistory.test.local
    depends_on:
      freeipa:
        condition: service_healthy
      ozone:
        condition: service_healthy
        # Ozone's container IP can change after a recreate. Spark History keeps
        # the Hadoop RPC address for its lifetime, so recreate it too and keep
        # completed Kyuubi engines visible in Jobs.
        restart: true
    volumes:
      - kerberos-shared:/shared:ro
    ports:
      - "18080:18080"
    networks:
      default:
        aliases:
          - sparkhistory.test.local
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ps -ef
          | grep -q '[o]rg.apache.spark.deploy.history.HistoryServer'
          && bash -c ': > /dev/tcp/sparkhistory.test.local/18080'
      interval: 10s
      timeout: 5s
      retries: 30

  # Flink session cluster (JobManager + TaskManager) and History Server. Only a
  # reference source for the Jobs "Running" section and the /flink-ui proxy — the
  # application never depends on it, so a missing Flink leaves the Jobs screen
  # working. The official flink image is multi-arch, so it runs natively on both
  # Intel and Apple Silicon. Completed jobs are archived to Kerberized Ozone
  # (ofs://ozone.test.local/flink/completed-jobs), the same store Spark uses, and
  # the History Server reads them back from there — see docker/flink/Dockerfile.
  flink-jobmanager:
    build:
      context: ./docker
      dockerfile: flink/Dockerfile
    image: kudos-flink:latest
    hostname: flink-jobmanager.test.local
    command: jobmanager
    depends_on:
      freeipa:
        condition: service_healthy
      ozone:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager.test.local
        jobmanager.archive.fs.dir: ofs://ozone.test.local/flink/completed-jobs
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        security.kerberos.login.keytab: /shared/flink-flink.test.local.keytab
        security.kerberos.login.principal: flink/flink.test.local@TEST.LOCAL
        security.kerberos.login.use-ticket-cache: false
        env.java.opts.all: -Djava.security.krb5.conf=/shared/krb5.conf
    volumes:
      - kerberos-shared:/shared:ro
    ports:
      - "8081:8081"
    networks:
      default:
        aliases:
          - flink-jobmanager.test.local
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c ': > /dev/tcp/flink-jobmanager.test.local/8081'"
      interval: 10s
      timeout: 5s
      retries: 30

  flink-taskmanager:
    image: kudos-flink:latest
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager.test.local
        # Kyuubi FLINK_SQL keeps two slots while the session engine is active;
        # reserve two more for the query job itself.
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - kerberos-shared:/shared:ro
    networks:
      - default

  flink-history:
    image: kudos-flink:latest
    hostname: flink-history.test.local
    command: history-server
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      ozone:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        historyserver.web.address: 0.0.0.0
        historyserver.web.port: 8082
        historyserver.archive.fs.dir: ofs://ozone.test.local/flink/completed-jobs
        historyserver.archive.fs.refresh-interval: 5000
        security.kerberos.login.keytab: /shared/flink-flink.test.local.keytab
        security.kerberos.login.principal: flink/flink.test.local@TEST.LOCAL
        security.kerberos.login.use-ticket-cache: false
        env.java.opts.all: -Djava.security.krb5.conf=/shared/krb5.conf
    volumes:
      - kerberos-shared:/shared:ro
    ports:
      # Host 8082 is taken by the reference Hue, so publish the History Server on 8083.
      - "8083:8082"
    networks:
      default:
        aliases:
          - flink-history.test.local
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c ': > /dev/tcp/flink-history.test.local/8082'"
      interval: 10s
      timeout: 5s
      retries: 30

  # HashiCorp Vault (dev mode) — issues the application's TLS certificate from
  # its PKI engine. Ephemeral and auto-unsealed; reconfigured on every up by
  # vault-bootstrap. This mirrors production, where the certificate is issued by
  # Vault and delivered by a Vault Agent sidecar (deploy/helm, docs/DEPLOY-HELM.md).
  vault:
    image: hashicorp/vault:1.18
    hostname: vault.test.local
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command: server -dev
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  # One-shot: configures the PKI engine (root CA + issuing role) and an AppRole,
  # then writes role_id/secret_id to the shared volume the agent authenticates with.
  vault-bootstrap:
    image: hashicorp/vault:1.18
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    entrypoint: ["sh", "/vault/bootstrap.sh"]
    volumes:
      - ./docker/vault/bootstrap.sh:/vault/bootstrap.sh:ro
      - vault-approle:/vault/approle
    restart: "no"

  # Vault Agent sidecar: logs in with the AppRole and issues the app's TLS
  # certificate from PKI as PEM into the shared app-tls volume, renewing it in
  # place. The app reads /vault/secrets/tls.{crt,key} through its `vault` profile.
  vault-agent:
    image: hashicorp/vault:1.18
    depends_on:
      vault:
        condition: service_healthy
      vault-bootstrap:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: http://vault:8200
    # Run as root so the agent can read the root-owned AppRole files and write
    # the shared named volume. In Kubernetes this is unnecessary — the Helm chart
    # relies on a Secret mount and an fsGroup-owned emptyDir instead.
    user: "0:0"
    entrypoint: ["vault"]
    command: ["agent", "-config=/vault/agent.hcl"]
    volumes:
      - ./docker/vault/agent.hcl:/vault/agent.hcl:ro
      - vault-approle:/vault/approle:ro
      - app-tls:/vault/secrets
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /vault/secrets/tls.crt && test -s /vault/secrets/tls.key
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  # Converts Vault's rotating PEM certificate into the PKCS#12 files expected
  # by Trino and its JDBC driver. It has no Kerberos material.
  trino-tls:
    build:
      context: ./docker
      dockerfile: trino-tls/Dockerfile
    depends_on:
      vault-agent:
        condition: service_healthy
    volumes:
      - app-tls:/vault/secrets:ro
      - trino-tls:/tls
    healthcheck:
      test: ["CMD-SHELL", "test -s /tls/trino.p12 && test -s /tls/truststore.p12"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  trino:
    build:
      context: ./docker
      dockerfile: trino/Dockerfile
    hostname: trino.test.local
    depends_on:
      freeipa:
        condition: service_healthy
      trino-tls:
        condition: service_healthy
    volumes:
      - kerberos-shared:/shared:ro
      - trino-tls:/tls:ro
    environment:
      # The coordinator calls its own HTTPS discovery endpoint. Its JVM must
      # trust the CA that Vault used to issue the coordinator certificate.
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/tls/truststore.p12
        -Djavax.net.ssl.trustStorePassword=changeit
        -Djavax.net.ssl.trustStoreType=PKCS12
    ports:
      - "8446:8443"
    networks:
      default:
        aliases:
          - trino.test.local
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/trino.test.local/8443'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Single-node analytical SQL engine for the editor. StarRocks speaks MySQL
  # wire protocol and deliberately stays outside the Kerberos data path.
  starrocks:
    image: starrocks/allin1-ubuntu:3.5.20
    platform: linux/amd64
    hostname: starrocks.test.local
    ports:
      - "9030:9030"
    networks:
      default:
        aliases:
          - starrocks.test.local
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -P 9030 -uroot -e 'SHOW FRONTENDS'"]
      interval: 10s
      timeout: 10s
      retries: 36
      start_period: 45s

  # Applies the least-privileged test account only after both Vault and the FE
  # are ready. The password is rendered by Vault, never kept in Compose.
  starrocks-bootstrap:
    image: starrocks/allin1-ubuntu:3.5.20
    platform: linux/amd64
    depends_on:
      starrocks:
        condition: service_healthy
      vault-agent:
        condition: service_healthy
    entrypoint: ["bash", "/bootstrap/bootstrap.sh"]
    volumes:
      - app-tls:/vault/secrets:ro
      - ./docker/starrocks/bootstrap.sql:/bootstrap/bootstrap.sql:ro
      - ./docker/starrocks/bootstrap.sh:/bootstrap/bootstrap.sh:ro
    restart: "no"

  app:
    # Thin distroless runtime built from the pre-built jar in ./dist. Populate
    # ./dist first with Dockerfile.build (run-test-env.sh does this automatically):
    #   docker build -f docker/app/Dockerfile.build --output type=local,dest=dist .
    build:
      context: .
      dockerfile: docker/app/Dockerfile.runtime
    hostname: app.test.local
    depends_on:
      freeipa:
        condition: service_healthy
      kyuubi:
        condition: service_healthy
      hdfs:
        condition: service_healthy
      hbase:
        condition: service_healthy
      ozone:
        condition: service_healthy
      spark-history:
        condition: service_healthy
      trino:
        condition: service_healthy
      starrocks-bootstrap:
        condition: service_completed_successfully
      # Wait until the Vault Agent has issued the TLS certificate the app serves.
      vault-agent:
        condition: service_healthy
    volumes:
      # Only krb5.conf and the CA — deliberately not the shared keytab volume.
      # The application has no keytab to read: it works from the ticket obtained
      # at user login, and a compromised app process cannot reach a service
      # keytab that was never mounted. TLS now comes from Vault (below), not here.
      - app-secrets:/run/secrets-kudos:ro
      # TLS material issued by Vault (tls.crt/tls.key/ca.crt), written by the
      # vault-agent sidecar. The `vault` profile points Spring Boot's SSL bundle
      # at /vault/secrets.
      - app-tls:/vault/secrets:ro
      - trino-tls:/run/trino-tls:ro
      # The ofs:// client needs the cluster's own service principals and
      # addresses; reuse the service configuration instead of restating it.
      - ./docker/ozone:/etc/ozone/conf:ro
      # Every kudos.cluster setting lives here and is editable without a
      # rebuild. See config/application.yml for why none of them are set as
      # environment variables below.
      - ./config:/etc/kudos:ro
      # Durable application and audit logs (kudos.logging.dir).
      - app-logs:/var/log/kudos
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/etc/kudos/
      # Vault Agent renders the StarRocks service-account URL here. The value is
      # not present in any YAML or image layer.
      SPRING_CONFIG_IMPORT: optional:file:/vault/secrets/starrocks.properties
      HBASE_REST_URL: http://hbase.test.local:8080
      # HTTPS is OFF by default (plain HTTP on 8443) so the browser and tests hit
      # no self-signed-cert errors. Turn TLS on with the Vault cert by exporting
      # both, then `docker compose up -d app`:
      #   SPRING_PROFILES_ACTIVE=vault \
      #   HEALTHCHECK_URL=https://app.test.local:8443/actuator/health
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-http://app.test.local:8443/actuator/health}
      # Log directory for the container (the app-logs volume above). Kept out of
      # the shared config file so local runs default to ./logs instead.
      KUDOS_LOGGING_DIR: /var/log/kudos
      # Operators can override this for an API-disabled deployment without
      # changing the mounted YAML: KUDOS_API_ENABLED=false docker compose up -d app
      KUDOS_API_ENABLED: ${KUDOS_API_ENABLED:-true}
      JAVA_TOOL_OPTIONS: >-
        -Djava.security.krb5.conf=/run/secrets-kudos/krb5.conf
        --add-exports=java.security.jgss/sun.security.krb5=ALL-UNNAMED
    # Port 8443 — HTTP by default, HTTPS when the vault profile is active.
    ports:
      - "8443:8443"
    # The distroless runtime image has no shell/curl — probe with the bundled JRE
    # running the precompiled healthcheck class (distroless is a JRE, so it runs a
    # .class but not a single-file .java). Kubernetes uses its own httpGet probe.
    healthcheck:
      test:
        - CMD
        - java
        - -jar
        - /app/healthcheck.jar
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s

  # Docker Hub Hue used only as a visual/behavioural reference. The derived
  # image replaces only Polars with its official legacy-CPU wheel so the
  # upstream amd64 Hue can also run through Rosetta on Apple Silicon.
  hue-reference:
    build: ./docker/hue-reference
    image: kudos-hue-reference:latest
    platform: linux/amd64
    hostname: hue-reference.test.local
    command: ["./build/env/bin/hue", "runcpserver"]
    depends_on:
      freeipa:
        condition: service_healthy
      hdfs:
        condition: service_healthy
    environment:
      KRB5_CONFIG: /run/kudos-hue/krb5.conf
      HADOOP_CONF_DIR: /etc/hadoop/conf
    volumes:
      - hue-secrets:/run/kudos-hue:ro
      - ./docker/hue-reference/hue.ini:/usr/share/hue/desktop/conf/z-kudos.ini:ro
      - ./docker/hdfs/core-site.xml:/etc/hadoop/conf/core-site.xml:ro
      - ./docker/hdfs/hdfs-site.xml:/etc/hadoop/conf/hdfs-site.xml:ro
    ports:
      - "8082:8888"
    networks:
      default:
        aliases:
          - hue-reference.test.local

volumes:
  freeipa-data:
  kerberos-shared:
  app-secrets:
  app-logs:
  freeipa-run:
  freeipa-tmp:
  hdfs-data:
  hbase-data:
  ozone-data:
  hue-secrets:
  # AppRole role_id/secret_id written by vault-bootstrap, read by vault-agent.
  vault-approle:
  # Vault-issued TLS PEM (tls.crt/tls.key/ca.crt) shared from vault-agent to app.
  app-tls:
  # PKCS#12 material derived from Vault PEM for Trino and its JDBC client.
  trino-tls:
