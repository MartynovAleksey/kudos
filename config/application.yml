# Runtime configuration for the kudos container.
#
# This file is mounted read-only at /etc/kudos/application.yml and loaded
# through spring.config.additional-location, so it overrides the defaults
# packaged in the jar. Edit it and restart the app service:
#
#   docker compose restart app
#
# Nothing here needs a rebuild. Keep the cluster addresses out of compose.yaml
# so this file stays the single place they are defined: OS environment
# variables outrank an external config file in Spring Boot, and a leftover
# variable would silently win over an edit made here.

# TLS is configured by the `vault` Spring profile (packaged
# application-vault.yml): the certificate is issued from HashiCorp Vault's PKI
# engine and delivered as PEM by a Vault Agent sidecar at /vault/secrets. The
# profile is activated with SPRING_PROFILES_ACTIVE=vault in the container (see
# compose.yaml and docs/DEPLOY-HELM.md); leaving it off keeps local runs on
# plain HTTP so they need no certificate.

spring:
  ldap:
    urls: ldap://freeipa.test.local:389
    base: dc=test,dc=local
    username: cn=Directory Manager
    password: DirectoryManager1
    user-dn-pattern: uid={0},cn=users,cn=accounts

kudos:
  # External, HTTP Basic-capable API. The browser UI uses a separate
  # session-only transport and remains functional when this is false.
  api:
    enabled: true

  cluster:
    # WebHDFS endpoint used by the file browser, over SPNEGO.
    webhdfs-url: http://hdfs.test.local:9870

    # Kyuubi HiveServer2 JDBC endpoint used by the query editor.
    kyuubi-url: jdbc:hive2://kyuubi.test.local:10009/default;principal=kyuubi/kyuubi.test.local@TEST.LOCAL

    # Internal Kyuubi REST endpoint used for session telemetry, never proxied to a browser.
    kyuubi-rest-url: http://kyuubi.test.local:10099

    # Kerberized Trino coordinator. The truststore contains the Vault PKI CA;
    # KerberosDelegation reuses the logged-in user's in-memory Subject ticket.
    trino-url: >-
      jdbc:trino://trino.test.local:8443/tpch/tiny?SSL=true&SSLTrustStorePath=/run/trino-tls/truststore.p12&SSLTrustStorePassword=changeit&SSLTrustStoreType=PKCS12&KerberosRemoteServiceName=HTTP&KerberosUseCanonicalHostname=false&KerberosDelegation=true

    # Kerberos-protected HBase REST Gateway; no ZooKeeper or HBase RPC is exposed to Kudos.
    hbase-rest-url: http://hbase.test.local:8080

    # Root of the Ozone filesystem browsed by the Ozone screen.
    ozone-ofs-uri: ofs://ozone.test.local/

    # Ozone's own core-site.xml and ozone-site.xml, mounted read-only. The
    # ofs:// client reads the service principals and addresses from them.
    ozone-conf-dir: /etc/ozone/conf

    # Spark History Server, read over SPNEGO by the jobs screen.
    spark-history-url: http://sparkhistory.test.local:18080

    # Every request runs as the logged-in LDAP user: {user} is substituted with
    # their login. The ticket comes from the password presented at sign-in, so
    # the application stores no keytab and holds no identity of its own.
    kerberos-principal: "{user}@TEST.LOCAL"

    # Flink JobManager REST for the Jobs "Running" source; blank disables it.
    flink-jobmanager-url: http://flink-jobmanager.test.local:8081

    # Flink History Server, reverse-proxied under /flink-ui for administrators.
    flink-history-url: http://flink-history.test.local:8082

    # Gravitino Iceberg REST catalog. The Editor catalog tree lists its
    # namespaces and tables so the same lakehouse is browsable from the query UI.
    gravitino-iceberg-uri: http://gravitino.test.local:9001/iceberg/

    # Gravitino management REST API used by the security-policy console.
    gravitino-rest-uri: ${GRAVITINO_REST_URI:http://gravitino.test.local:8090}

    # Ozone path where the log collector writes each Kyuubi engine's stdout and
    # stderr. The Logs tab of a Spark job reads it back from here; blank hides
    # that tab.
    engine-logs-path: /s3v/enginelogs

  # UI-level settings.
  ui:
    # Optional HTML shown as a banner across the top of every screen. Trusted
    # operator config, rendered as-is. Leave unset for no banner. Example:
    # banner-html: '<strong>TEST</strong> environment — data is not production.'
    banner-html: ""
    # Where an administrator's choice of visible left-panel tools is stored, so
    # it applies to every user on their next sign-in. Set for the container via
    # the KUDOS_UI_TOOL_VISIBILITY_FILE environment variable in compose.yaml (for
    # the same reason as the log directory below); empty here holds the choice in
    # memory only, which is the safe default for local runs and tests.
    tool-visibility-file: ${KUDOS_UI_TOOL_VISIBILITY_FILE:}
    # Same, for which SQL engines are shown in the editor.
    engine-visibility-file: ${KUDOS_UI_ENGINE_VISIBILITY_FILE:}

  # The log directory (kudos.logging.dir) is set for the container via the
  # KUDOS_LOGGING_DIR environment variable in compose.yaml, not here: this file
  # is also auto-loaded when running locally from the project root, and an
  # absolute container path would then break local runs. It defaults to ./logs.

  # Audit of user actions. Always written to ${kudos.logging.dir}/audit.log.
  # To also publish each event to Kafka, set kafka-enabled: true and provide a
  # broker via spring.kafka.bootstrap-servers.
  audit:
    kafka-enabled: false
    kafka-topic: kudos-audit

  # Login brute-force guard: lock a username after this many consecutive failed
  # attempts, for this many minutes.
  security:
    max-login-attempts: 5
    lockout-minutes: 15

  # Service modules. Set any to false to remove that screen from the sidebar and
  # make its API and UI-only transport answer 404 — for a cluster that does not
  # run that service.
  features:
    editor: true   # Kyuubi Spark SQL  (/editor, /api/sql/**, /ui-api/sql/**)
    files: true    # HDFS browser      (/filebrowser, /api/hdfs/**, /ui-api/hdfs/**)
    ozone: true    # Ozone browser     (/ozone, /api/ozone/**, /ui-api/ozone/**)
    hbase: true    # HBase browser     (/hbase, /api/hbase/**, /ui-api/hbase/**)
    jobs: true     # Spark jobs + UI   (/jobs, /api/spark/**, /ui-api/spark/**, /spark-ui/**)
# spring:
#   kafka:
#     bootstrap-servers: kafka.test.local:9092

# Standard Spring log levels; tune per package as needed.
logging:
  level:
    com.kudos.ui: INFO
