# Runtime configuration for the kudos container.
#
# This file is mounted read-only at /etc/kudos/application.yml and loaded
# through spring.config.additional-location, so it overrides the defaults
# packaged in the jar. Edit it and restart the app service:
#
#   docker compose restart app
#
# Nothing here needs a rebuild. Keep the cluster addresses out of compose.yaml
# so this file stays the single place they are defined: OS environment
# variables outrank an external config file in Spring Boot, and a leftover
# variable would silently win over an edit made here.

# TLS is configured by the `vault` Spring profile (packaged
# application-vault.yml): the certificate is issued from HashiCorp Vault's PKI
# engine and delivered as PEM by a Vault Agent sidecar at /vault/secrets. The
# profile is activated with SPRING_PROFILES_ACTIVE=vault in the container (see
# compose.yaml and docs/DEPLOY-HELM.md); leaving it off keeps local runs on
# plain HTTP so they need no certificate.

spring:
  ldap:
    urls: ldap://freeipa.test.local:389
    base: dc=test,dc=local
    username: cn=Directory Manager
    password: DirectoryManager1
    user-dn-pattern: uid={0},cn=users,cn=accounts

k8spark:
  cluster:
    # WebHDFS endpoint used by the file browser, over SPNEGO.
    webhdfs-url: http://hdfs.test.local:9870

    # Kyuubi HiveServer2 JDBC endpoint used by the query editor.
    kyuubi-url: jdbc:hive2://kyuubi.test.local:10009/default;principal=kyuubi/kyuubi.test.local@TEST.LOCAL

    # ZooKeeper quorum the HBase client bootstraps from.
    hbase-quorum: hbase.test.local

    # Root of the Ozone filesystem browsed by the Ozone screen.
    ozone-ofs-uri: ofs://ozone.test.local/

    # Ozone's own core-site.xml and ozone-site.xml, mounted read-only. The
    # ofs:// client reads the service principals and addresses from them.
    ozone-conf-dir: /etc/ozone/conf

    # Spark History Server, read over SPNEGO by the jobs screen.
    spark-history-url: http://sparkhistory.test.local:18080

    # Every request runs as the logged-in LDAP user: {user} is substituted with
    # their login. The ticket comes from the password presented at sign-in, so
    # the application stores no keytab and holds no identity of its own.
    kerberos-principal: "{user}@TEST.LOCAL"

  # UI-level settings.
  ui:
    # Optional HTML shown as a banner across the top of every screen (like Hue's
    # banner_top_html). Trusted operator config, rendered as-is. Leave unset for
    # no banner. Example:
    # banner-html: '<strong>TEST</strong> environment — data is not production.'
    banner-html: ""

  # The log directory (k8spark.logging.dir) is set for the container via the
  # K8SPARK_LOGGING_DIR environment variable in compose.yaml, not here: this file
  # is also auto-loaded when running locally from the project root, and an
  # absolute container path would then break local runs. It defaults to ./logs.

  # Audit of user actions. Always written to ${k8spark.logging.dir}/audit.log.
  # To also publish each event to Kafka, set kafka-enabled: true and provide a
  # broker via spring.kafka.bootstrap-servers.
  audit:
    kafka-enabled: false
    kafka-topic: k8spark-audit

  # Login brute-force guard: lock a username after this many consecutive failed
  # attempts, for this many minutes.
  security:
    max-login-attempts: 5
    lockout-minutes: 15

  # Service modules. Set any to false to remove that screen from the sidebar and
  # make its API answer 404 — for a cluster that does not run that service.
  features:
    editor: true   # Kyuubi Spark SQL  (/editor, /api/sql/**)
    files: true    # HDFS browser      (/filebrowser, /api/hdfs/**)
    ozone: true    # Ozone browser     (/ozone, /api/ozone/**)
    hbase: true    # HBase browser     (/hbase, /api/hbase/**)
    jobs: true     # Spark jobs + UI   (/jobs, /api/spark/**, /spark-ui/**)
# spring:
#   kafka:
#     bootstrap-servers: kafka.test.local:9092

# Standard Spring log levels; tune per package as needed.
logging:
  level:
    com.k8spark.ui: INFO
