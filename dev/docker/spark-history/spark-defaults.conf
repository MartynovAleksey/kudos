# The history server reads the same Ozone location the Kyuubi engines write to.
spark.history.fs.logDirectory=ofs://ozone.test.local/spark/eventlogs
spark.history.ui.port=18080

# Rescan often: engines in this stand are short-lived, so a query finishes long
# before the default ten-second interval would matter, but a stale list is the
# first thing that looks broken when checking the jobs screen.
spark.history.fs.update.interval=5s

# Kerberos identity used to read the event logs.
spark.history.kerberos.enabled=true
spark.history.kerberos.principal=spark/sparkhistory.test.local@TEST.LOCAL
spark.history.kerberos.keytab=/shared/spark-sparkhistory.test.local.keytab

# The UI and its REST API are left unauthenticated. Spark 4 serves them through
# Jetty on jakarta.servlet, while Hadoop's SPNEGO AuthenticationFilter is still
# a javax.servlet.Filter, so Spark rejects it at bind time and there is no
# jakarta build of it to substitute. Reading the event logs out of Ozone stays
# Kerberized through the settings above; only the web endpoint is open.
