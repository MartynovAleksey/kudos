kyuubi.authentication=KERBEROS
kyuubi.kinit.principal=kyuubi/kyuubi.test.local@TEST.LOCAL
kyuubi.kinit.keytab=/shared/kyuubi.keytab
kyuubi.engine.type=SPARK_SQL
kyuubi.engine.share.level=CONNECTION

# REST is enabled only for the application's server-side session telemetry;
# the browser never reaches it directly and Kyuubi UI is not proxied.
kyuubi.frontend.protocols=THRIFT_BINARY,REST
kyuubi.frontend.rest.bind.host=0.0.0.0
kyuubi.frontend.rest.bind.port=10099
kyuubi.spnego.principal=HTTP/kyuubi.test.local@TEST.LOCAL
kyuubi.spnego.keytab=/shared/HTTP-kyuubi.test.local.keytab

spark.master=local[*]
# The per-engine Spark UI stays off. Engines here are short-lived, so finished
# applications are read from the history server instead.
spark.ui.enabled=false

# Iceberg lakehouse catalog backed by the shared Gravitino Iceberg REST endpoint.
# The catalog name "iceberg" resolves the same S3-backed tables every engine sees
# (iceberg.<schema>.<table>). Data lives in Ozone, reached over the S3 Gateway
# (s3://warehouse/iceberg) via Iceberg's S3FileIO, so Trino and StarRocks — which
# have no ofs:// client — read the exact same tables. The warehouse itself is
# omitted (Gravitino would read it as a named-catalog selector); the S3 endpoint
# and admin credentials are supplied here since the REST server never vends the
# secret.
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type=rest
spark.sql.catalog.iceberg.uri=http://gravitino.test.local:9001/iceberg/
spark.sql.catalog.iceberg.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint=http://ozone.test.local:9878
spark.sql.catalog.iceberg.s3.path-style-access=true
spark.sql.catalog.iceberg.s3.access-key-id=admin@TEST.LOCAL
spark.sql.catalog.iceberg.s3.secret-access-key=__KUDOS_S3_SECRET__
spark.sql.catalog.iceberg.client.region=us-east-1

# Every engine records its history in Ozone, where the history server reads it.
spark.eventLog.enabled=true
spark.eventLog.dir=ofs://ozone.test.local/spark/eventlogs
spark.eventLog.compress=false
