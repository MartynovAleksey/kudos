[desktop]
  [[kerberos]]
    # Disposable test identity copied by FreeIPA bootstrap to hue-secrets.
    hue_keytab=/run/kudos-hue/admin.keytab
    hue_principal=admin@TEST.LOCAL
    ccache_path=/tmp/hue_krb5_ccache

[hadoop]
  [[hdfs_clusters]]
    [[[default]]]
      fs_defaultfs=hdfs://hdfs.test.local:8020
      webhdfs_url=http://hdfs.test.local:9870/webhdfs/v1
      security_enabled=true
