# Full Apache Gravitino server for the KUDOS test stand.
#
# Unlike the standalone Iceberg REST server, the full server runs the Iceberg
# REST catalog as an auxiliary service *under Gravitino's authorization*. That
# makes the shared :9001/iceberg endpoint the metadata gate for the lakehouse:
# Gravitino's built-in access control is deny-by-default, so a user who was not
# granted a privilege cannot list or load a table's metadata. Gravitino is the
# sole policy store for this metadata path.
#
# The warehouse still lives in Ozone, addressed over S3 (s3://warehouse/iceberg)
# via the S3 Gateway, and the Iceberg catalog backend is the same SQLite DB the
# standalone server used — so the demo tables survive the migration.

# --- Web server -----------------------------------------------------------
gravitino.server.shutdown.timeout = 3000
gravitino.server.webserver.host = 0.0.0.0
gravitino.server.webserver.httpPort = 8090
gravitino.server.webserver.minThreads = 24
gravitino.server.webserver.maxThreads = 200
gravitino.server.webserver.stopTimeout = 30000
gravitino.server.webserver.idleTimeout = 30000
gravitino.server.webserver.threadPoolWorkQueueSize = 100
gravitino.server.webserver.requestHeaderSize = 131072
gravitino.server.webserver.responseHeaderSize = 131072

# --- Entity store (server metadata: metalakes, catalogs, roles, grants) ---
# Embedded H2 on the gravitino data volume — no separate database service.
gravitino.entity.store = relational
gravitino.entity.store.relational = JDBCBackend
gravitino.entity.store.relational.jdbcUrl = jdbc:h2
gravitino.entity.store.relational.jdbcDriver = org.h2.Driver
gravitino.entity.store.relational.jdbcUser = gravitino
gravitino.entity.store.relational.jdbcPassword = gravitino

gravitino.catalog.cache.evictionIntervalMs = 3600000

# --- Authentication / Authorization ---------------------------------------
# simple auth: the request's identity is taken from the Authorization header
# (no external IdP on the metadata path). Built-in authorization enforces
# metadata access deny-by-default.
gravitino.authenticators = simple
gravitino.authorization.enable = true
# `anonymous` is the identity every engine and the dynamic config provider use
# when they call the Iceberg REST service without a header. Keeping it a service
# admin means the (deliberately still-open) query path is unaffected while real,
# named users are subject to Gravitino-managed grants. Locking the engines/storage
# themselves is a separate, later slice.
gravitino.authorization.serviceAdmins = anonymous

# --- Iceberg REST auxiliary service ---------------------------------------
# Same endpoint the engines already use: http://gravitino.test.local:9001/iceberg/
gravitino.auxService.names = iceberg-rest
gravitino.auxService.iceberg-rest.classpath = iceberg-rest-server/libs, iceberg-rest-server/conf
gravitino.auxService.iceberg-rest.host = 0.0.0.0
gravitino.auxService.iceberg-rest.httpPort = 9001
# The dynamic provider reads each catalog's real configuration (warehouse, S3
# credentials, io-impl) from the Gravitino metalake catalog `catalog_iceberg`,
# which start-gravitino creates at runtime. This is what ties the REST catalog
# to Gravitino's authorization.
gravitino.iceberg-rest.catalog-config-provider = dynamic-config-provider
gravitino.iceberg-rest.gravitino-uri = http://localhost:8090
gravitino.iceberg-rest.gravitino-metalake = metalake_demo
gravitino.iceberg-rest.default-catalog-name = catalog_iceberg
gravitino.iceberg-rest.gravitino-simple.user-name = anonymous
