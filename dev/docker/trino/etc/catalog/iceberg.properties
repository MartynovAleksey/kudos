# Iceberg tables from the shared Gravitino REST catalog. Trino has no ofs://
# client, so the warehouse is reached over the Ozone S3 Gateway (s3://) using
# Trino's native S3 filesystem — no Hadoop or Ozone jars involved. The admin S3
# credentials sign requests; path-style URLs avoid per-bucket DNS.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://gravitino.test.local:9001/iceberg/
fs.native-s3.enabled=true
s3.endpoint=http://ozone.test.local:9878
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=admin@TEST.LOCAL
s3.aws-secret-key=${ENV:KUDOS_S3_SECRET}
