[SERVICE]
    Flush        5
    Log_Level    info
    Daemon       Off
    Parsers_File parsers.conf

# Every Kyuubi engine is a separate JVM whose stdout and stderr Kyuubi redirects
# into work/<user>/kyuubi-spark-sql-engine.log.<n>. Tailing that file is what
# makes the whole stream available, not just what log4j2 happened to format:
# JVM stack traces and anything the engine prints directly are in it too.
#
# Deliberately no multiline parser. Folding a stack trace into one record would
# reformat the lines, and the point of this pipeline is that what lands in Ozone
# is byte-for-byte what the engine wrote.
[INPUT]
    Name             tail
    Path             /opt/kyuubi/work/*/kyuubi-spark-sql-engine.log.*
    Tag_Regex        ^/opt/kyuubi/work/(?<user>[^/]+)/kyuubi-spark-sql-engine\.log\.(?<seq>\d+)$
    Tag              engine.<user>.<seq>
    Path_Key         log_file
    Key              log
    Skip_Empty_Lines Off
    Read_from_Head   On
    Refresh_Interval 5
    DB               /var/lib/fluent-bit/tail.db

# log_key writes only the value of that key, so the object holds the original
# log lines instead of a JSON envelope: readable with the Ozone screen's preview,
# with cat, and by the stand's SQL engines.
#
# compression is deliberately unset. gzip would halve the volume but turn the
# preview pane into binary, and stand volumes are small.
#
# $INDEX is a counter kept in store_dir, so object names are ordered rather than
# random. It counts uploads across every tag, so one engine's objects can be
# part-0, part-2, part-5 — gaps are expected and the reader sorts numerically.
[OUTPUT]
    Name             s3
    Match            engine.*
    bucket           enginelogs
    endpoint         http://ozone.test.local:9878
    region           us-east-1
    log_key          log
    use_put_object   On
    static_file_path On
    total_file_size  4M
    upload_timeout   30s
    s3_key_format    /$TAG[1]/$TAG[2]/part-$INDEX.log
    store_dir        /var/lib/fluent-bit/s3
