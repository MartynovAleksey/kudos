apiVersion: v1
kind: Service
metadata:
  name: {{ include "kudos.fullname" . }}
  labels:
    {{- include "kudos.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
  selector:
    {{- include "kudos.selectorLabels" . | nindent 4 }}
