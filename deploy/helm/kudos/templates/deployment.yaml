apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kudos.fullname" . }}
  labels:
    {{- include "kudos.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kudos.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/vault-agent: {{ .Files.Get "files/agent.hcl" | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kudos.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kudos.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Issues the TLS certificate once (exit-after-auth) so it exists before
        # the app starts its HTTPS connector.
        - name: vault-agent-init
          image: {{ .Values.vault.image | quote }}
          # Bypass the image entrypoint (it chowns/setcaps, which fails under a
          # read-only config mount and dropped capabilities) and run vault directly.
          command: ["vault"]
          args: ["agent", "-config=/vault/config/agent.hcl", "-exit-after-auth"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "kudos.vaultAgentEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "kudos.vaultAgentMounts" . | nindent 12 }}
          resources:
            {{- toYaml .Values.vault.resources | nindent 12 }}
      containers:
        - name: app
          image: {{ include "kudos.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfiles | quote }}
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/etc/kudos/"
            - name: K8SPARK_LOGGING_DIR
              value: {{ .Values.logging.dir | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Djava.security.krb5.conf=/etc/krb5.conf
                --add-exports=java.security.jgss/sun.security.krb5=ALL-UNNAMED
          {{- with .Values.externalConfig.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: app-config
              mountPath: /etc/kudos
              readOnly: true
            - name: krb5
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
              readOnly: true
            - name: cluster-conf
              mountPath: /etc/ozone/conf
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
            - name: logs
              mountPath: {{ .Values.logging.dir | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        # Sidecar: renews the certificate in place as its lease nears expiry.
        - name: vault-agent
          image: {{ .Values.vault.image | quote }}
          command: ["vault"]
          args: ["agent", "-config=/vault/config/agent.hcl"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "kudos.vaultAgentEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "kudos.vaultAgentMounts" . | nindent 12 }}
          resources:
            {{- toYaml .Values.vault.resources | nindent 12 }}
      volumes:
        - name: app-config
          configMap:
            name: {{ required "externalConfig.appConfigMap is required" .Values.externalConfig.appConfigMap }}
        - name: krb5
          configMap:
            name: {{ required "externalConfig.krb5ConfigMap is required" .Values.externalConfig.krb5ConfigMap }}
        - name: cluster-conf
          configMap:
            name: {{ required "externalConfig.clusterConfigMap is required" .Values.externalConfig.clusterConfigMap }}
        - name: vault-approle
          secret:
            secretName: {{ required "vault.appRoleSecret is required" .Values.vault.appRoleSecret }}
        - name: vault-config
          configMap:
            name: {{ include "kudos.fullname" . }}-vault-agent
        - name: vault-secrets
          emptyDir:
            medium: Memory
        - name: vault-home
          emptyDir: {}
        - name: logs
          emptyDir: {}
        {{- with .Values.vault.caConfigMap }}
        - name: vault-ca
          configMap:
            name: {{ . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
