# TLS profile: serve HTTPS with a certificate issued by HashiCorp Vault's PKI
# engine and delivered as PEM by a Vault Agent sidecar into /vault/secrets.
#
# Activated with SPRING_PROFILES_ACTIVE=vault in the container (compose.yaml and
# the Helm deployment). Kept out of the default config on purpose: a Spring Boot
# SSL bundle loads its PEM material eagerly at startup, so binding it only under
# this profile keeps local runs and the test build (which never activate it) from
# needing a certificate on disk.
#
# reload-on-update makes the app re-read the files when Vault Agent rotates them,
# so a renewed certificate is picked up without a restart. Paths are overridable
# for environments that mount the material elsewhere.
server:
  port: 8443
  ssl:
    enabled: true
    bundle: vault

spring:
  ssl:
    bundle:
      pem:
        vault:
          reload-on-update: true
          keystore:
            certificate: ${KUDOS_TLS_CERT:/vault/secrets/tls.crt}
            private-key: ${KUDOS_TLS_KEY:/vault/secrets/tls.key}
