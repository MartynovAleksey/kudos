<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('filebrowser', 'File Browser', ~{:: #content})}">
<body>
<div id="content">
  <nav class="navbar hue-title-bar nokids">
    <div class="navbar-inner">
      <div class="container-fluid">
        <ul class="nav editor-nav">
          <li class="app-header"><i class="fa fa-fw fa-files-o"></i> HDFS</li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="card card-small">
    <div class="card-body">
      <div id="breadcrumbs" class="k8s-breadcrumbs"></div>
      <div id="listing" th:attr="data-path=${path}"></div>
      <div id="preview"></div>
    </div>
  </div>
</div>
</body>
</html>
