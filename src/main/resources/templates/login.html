<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>k8spark-ui - Sign in</title>
  <link rel="icon" type="image/png" sizes="64x64" th:href="@{/static/app/brand/favicon-64.png}"/>
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/static/app/brand/favicon-32.png}"/>
  <link rel="stylesheet" th:href="@{/static/desktop/css/roboto.css}"/>
  <link rel="stylesheet" th:href="@{/static/desktop/ext/css/font-awesome.min.css}"/>
  <link rel="stylesheet" th:href="@{/static/desktop/ext/css/cui/cui.css}"/>
  <link rel="stylesheet" th:href="@{/static/desktop/ext/css/cui/bootstrap2.css}"/>
  <link rel="stylesheet" th:href="@{/static/desktop/ext/css/cui/bootstrap-responsive2.css}"/>
  <link rel="stylesheet" th:href="@{/static/desktop/css/hue.css}"/>
  <link rel="stylesheet" th:href="@{/static/desktop/css/login.css}"/>
  <link rel="stylesheet" th:href="@{/static/app/k8spark.css}"/>
</head>
<body>
<div class="login-page">
  <div class="login-container">
    <form method="POST" th:action="@{/login}" autocomplete="off">
      <div class="logo">
        <img class="login-logo" th:src="@{/static/app/brand/logo-name.png}" alt="KUDOS"/>
      </div>
      <div class="login-lead">From legacy to legacy-ready.</div>
      <h3>Query. Explore. Repeat.</h3>

      <div class="alert alert-error center" th:if="${param.error}">
        Invalid username or password.
        <span th:if="${param.remaining != null}"
              th:text="'Attempts remaining: ' + ${param.remaining[0]} + '.'">Attempts remaining.</span>
      </div>
      <div class="alert alert-error center" th:if="${param.locked}">
        Too many failed attempts. Account temporarily locked.
        <span th:if="${param.seconds != null}"
              th:text="'Try again in ' + ${param.seconds[0]} + ' s.'"></span>
      </div>
      <div class="alert alert-info center" th:if="${param.logout}">
        You have been signed out.
      </div>
      <div class="alert alert-info center" th:if="${param.expired}">
        Your Kerberos ticket expired. Please sign in again.
      </div>

      <div class="text-input">
        <input type="text" name="username" placeholder="Username" autocapitalize="off"
               autocorrect="off" spellcheck="false" autofocus="autofocus"/>
      </div>
      <div class="text-input">
        <input type="password" name="password" placeholder="Password"/>
      </div>
      <input type="submit" class="btn btn-primary" value="Sign In"/>
    </form>
  </div>
</div>
</body>
</html>
