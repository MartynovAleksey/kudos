<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('hbase', 'HBase', ~{:: #content})}">
<body>
<div id="content">
  <nav class="navbar k8s-title-bar nokids">
    <div class="navbar-inner">
      <div class="container-fluid">
        <ul class="nav editor-nav">
          <li class="app-header"><i class="fa fa-fw fa-database"></i> HBase</li>
        </ul>
        <div class="pull-right" style="padding: 7px 0;">
          <button id="refreshTables" class="btn btn-small" type="button">
            <i class="fa fa-refresh"></i> Refresh
          </button>
          <button id="newTableButton" class="btn btn-primary btn-small" type="button">
            <i class="fa fa-plus"></i> New table
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="row-fluid">
    <div class="span3">
      <div class="card card-small">
        <div class="card-body">
          <h4 class="card-heading simple">Tables</h4>
          <ul id="tableList" class="k8s-table-list">
            <li class="k8s-muted">Loading…</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="span9">
      <div class="card card-small">
        <div class="card-body">
          <div id="tableView">
            <div class="k8s-muted">Pick a table to browse its rows, or create a new one.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
