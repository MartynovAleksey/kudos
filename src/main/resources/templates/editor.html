<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('editor', 'Editor', ~{:: #content})}">
<body>
<div id="content">
  <nav class="navbar hue-title-bar nokids">
    <div class="navbar-inner">
      <div class="container-fluid">
        <ul class="nav editor-nav">
          <li class="app-header"><i class="fa fa-fw fa-code"></i> Kyuubi Spark SQL</li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="card card-small">
    <div class="card-body">
      <div class="k8s-table-head">
        <h4 class="card-heading simple">Sessions</h4>
        <button id="newSession" class="btn btn-small btn-primary" type="button">
          <i class="fa fa-plus"></i> New session
        </button>
      </div>
      <div id="sessionsPanel">
        <div class="k8s-muted">No sessions — queries run on the default engine.</div>
      </div>
    </div>
  </div>

  <div class="card card-small">
    <div class="card-body">
      <textarea id="queryField" class="k8s-editor-area" tabindex="1"
                spellcheck="false"
                placeholder="Example: SELECT 40 + 2 AS result"></textarea>
      <div class="actions" style="margin-top: 10px;">
        <button type="button" id="executeQuery" class="btn btn-primary" tabindex="2">Execute</button>
        <button type="button" id="exportExcel" class="btn" tabindex="3">
          <i class="fa fa-file-excel-o"></i> Export to Excel
        </button>
        <span class="muted" style="padding-left: 10px;">Ctrl + Enter</span>
      </div>
    </div>
  </div>

  <div class="card card-small scrollable resultsContainer">
    <div class="card-body">
      <ul class="nav nav-tabs">
        <li class="active"><a href="javascript:void(0)">Results</a></li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane active">
          <div id="queryResults">
            <div class="k8s-muted">Run a query to see its results.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
