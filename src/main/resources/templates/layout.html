<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(app, title, content)">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="'kudos - ' + ${title}">kudos</title>
  <link rel="icon" type="image/png" sizes="64x64" th:href="@{/static/app/brand/favicon-64.png}"/>
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/static/app/brand/favicon-32.png}"/>
  <link rel="stylesheet" th:href="@{/static/desktop/css/roboto.css}"/>
  <link rel="stylesheet" th:href="@{/static/desktop/ext/css/font-awesome.min.css}"/>
  <link rel="stylesheet" th:href="@{/static/app/kudos-base.css}"/>
  <link rel="stylesheet" th:href="@{/static/app/kudos.css}"/>
  <script th:src="@{/static/app/kudos.js}" defer="defer"></script>
</head>
<body data-ui-mode="modern" data-ui-theme="system" data-ui-system-theme="light" data-ui-sidebar="collapsed"
      th:attr="data-app=${app},data-ui-user=${#authentication.name}">
<div class="k8s-page">
  <div class="sidebar sidebar-collapsed">
    <div class="sidebar-header">
      <a th:href="@{/editor}" aria-label="KUDOS">
        <img class="sidebar-logo" th:src="@{/static/app/brand/logo-mark.png}" alt="KUDOS"/>
      </a>
    </div>
    <nav class="sidebar-body">
      <div class="sidebar-accordion-item" th:if="${securityOfficer}"
           th:classappend="${app == 'security-policies'} ? ' sidebar-active'">
        <a class="sidebar-sidebar-item" th:href="@{/security/policies}" title="Security policies" aria-label="Security policies">
          <div class="sidebar-sidebar-item-icon"><i class="fa fa-fw fa-shield"></i></div>
          <span>Security policies</span>
        </a>
      </div>
      <div class="sidebar-accordion-item" data-ui-tool="editor"
           th:if="${(!securityOfficer or administrator) and features.editor and (administrator or toolVisibility.editor)}"
           th:hidden="${administrator and !toolVisibility.editor}"
           th:classappend="${app == 'editor'} ? ' sidebar-active'">
        <a class="sidebar-sidebar-item" th:href="@{/editor}" title="Editor" aria-label="Editor">
          <div class="sidebar-sidebar-item-icon"><i class="fa fa-fw fa-code"></i></div>
          <span>Editor</span>
        </a>
      </div>
      <div class="sidebar-accordion-item" data-ui-tool="files"
           th:if="${(!securityOfficer or administrator) and features.files and (administrator or toolVisibility.files)}"
           th:hidden="${administrator and !toolVisibility.files}"
           th:classappend="${app == 'filebrowser'} ? ' sidebar-active'">
        <a class="sidebar-sidebar-item" th:href="@{/filebrowser}" title="Files" aria-label="Files">
          <div class="sidebar-sidebar-item-icon"><i class="fa fa-fw fa-files-o"></i></div>
          <span>Files</span>
        </a>
      </div>
      <div class="sidebar-accordion-item" data-ui-tool="ozone"
           th:if="${(!securityOfficer or administrator) and features.ozone and (administrator or toolVisibility.ozone)}"
           th:hidden="${administrator and !toolVisibility.ozone}"
           th:classappend="${app == 'ozone'} ? ' sidebar-active'">
        <a class="sidebar-sidebar-item" th:href="@{/ozone}" title="Ozone" aria-label="Ozone">
          <div class="sidebar-sidebar-item-icon"><i class="fa fa-fw fa-cloud"></i></div>
          <span>Ozone</span>
        </a>
      </div>
      <div class="sidebar-accordion-item" data-ui-tool="hbase"
           th:if="${(!securityOfficer or administrator) and features.hbase and (administrator or toolVisibility.hbase)}"
           th:hidden="${administrator and !toolVisibility.hbase}"
           th:classappend="${app == 'hbase'} ? ' sidebar-active'">
        <a class="sidebar-sidebar-item" th:href="@{/hbase}" title="HBase" aria-label="HBase">
          <div class="sidebar-sidebar-item-icon"><i class="fa fa-fw fa-database"></i></div>
          <span>HBase</span>
        </a>
      </div>
      <div class="sidebar-accordion-item" data-ui-tool="jobs"
           th:if="${(!securityOfficer or administrator) and features.jobs and (administrator or toolVisibility.jobs)}"
           th:hidden="${administrator and !toolVisibility.jobs}"
           th:classappend="${app == 'jobs'} ? ' sidebar-active'">
        <a class="sidebar-sidebar-item" th:href="@{/jobs}" title="Jobs" aria-label="Jobs">
          <div class="sidebar-sidebar-item-icon"><i class="fa fa-fw fa-tasks"></i></div>
          <span>Jobs</span>
        </a>
      </div>
      <div class="sidebar-sidebar-spacer"></div>
      <div class="sidebar-accordion-item" th:if="${!securityOfficer or administrator}"
           th:classappend="${app == 'docs'} ? ' sidebar-active'">
        <a class="sidebar-sidebar-item" th:href="@{/docs}" title="Docs" aria-label="Docs">
          <div class="sidebar-sidebar-item-icon"><i class="fa fa-fw fa-book"></i></div>
          <span>Docs</span>
        </a>
      </div>
    </nav>
  <div class="sidebar-footer">
      <button id="uiSettingsButton" class="sidebar-sidebar-item sidebar-settings-button" type="button"
              title="Interface settings" aria-label="Interface settings" aria-controls="uiSettingsPanel" aria-expanded="false">
        <div class="sidebar-sidebar-item-icon"><i class="fa fa-fw fa-cog"></i></div>
        <span>Settings</span>
      </button>
      <!-- Bottom-most control: the sidebar collapse toggle. Sign out now lives
           next to the user in the ticket timer, not here. -->
      <button id="uiSidebarCollapse" class="sidebar-sidebar-item sidebar-footer-collapse-btn sidebar-base-btn"
              type="button" title="Collapse sidebar" aria-label="Collapse sidebar" aria-pressed="false">
        <div class="sidebar-sidebar-item-icon"><i class="fa fa-fw fa-angle-double-left"></i></div>
        <span>Collapse</span>
      </button>
      <div class="sidebar-footer-bottom-color-line"></div>
    </div>
  </div>

  <div class="main-page">
    <!-- Optional operator banner from kudos.ui.banner-html; trusted config,
         rendered as-is. Absent when the property is empty. -->
    <div class="k8s-banner" th:if="${bannerHtml != null and !bannerHtml.isEmpty()}"
         th:utext="${bannerHtml}"></div>
    <div class="content-wrapper">
      <div class="page-content" th:insert="${content}"></div>
    </div>
  </div>
  </div>
  <aside id="uiSettingsPanel" class="k8s-ui-settings" role="dialog" aria-label="Interface settings" hidden>
    <div class="k8s-ui-settings-header">
      <strong>Interface settings</strong>
      <button id="uiSettingsClose" class="k8s-ui-settings-close" type="button" aria-label="Close settings">×</button>
    </div>
    <fieldset class="k8s-ui-settings-group">
      <legend>Theme</legend>
      <div class="k8s-ui-choice-group">
        <button type="button" data-ui-theme-choice="light" aria-pressed="false">Light</button>
        <button type="button" data-ui-theme-choice="dark" aria-pressed="false">Dark</button>
        <button type="button" data-ui-theme-choice="system" aria-pressed="true">System</button>
      </div>
      <p class="k8s-ui-theme-preview" aria-live="polite"></p>
    </fieldset>
    <!-- Tool visibility below is a deployment-wide setting an administrator
         changes for everyone, so it is shown only to administrators. Each
         checkbox reflects the server's stored choice and, once changed, applies
         to every user on their next sign-in. -->
    <fieldset class="k8s-ui-settings-group" th:if="${administrator}">
      <legend>Visible tools</legend>
      <label data-ui-tool-setting="editor" th:if="${features.editor}"><input type="checkbox" data-ui-tool-choice="editor" th:checked="${toolVisibility.editor}"/> Editor</label>
      <label data-ui-tool-setting="files" th:if="${features.files}"><input type="checkbox" data-ui-tool-choice="files" th:checked="${toolVisibility.files}"/> Files</label>
      <label data-ui-tool-setting="ozone" th:if="${features.ozone}"><input type="checkbox" data-ui-tool-choice="ozone" th:checked="${toolVisibility.ozone}"/> Ozone</label>
      <label data-ui-tool-setting="hbase" th:if="${features.hbase}"><input type="checkbox" data-ui-tool-choice="hbase" th:checked="${toolVisibility.hbase}"/> HBase</label>
      <label data-ui-tool-setting="jobs" th:if="${features.jobs}"><input type="checkbox" data-ui-tool-choice="jobs" th:checked="${toolVisibility.jobs}"/> Jobs</label>
    </fieldset>
    <!-- SQL engines shown in the editor. Deployment-wide, administrator-only,
         applied to every user on their next page load. -->
    <fieldset class="k8s-ui-settings-group" th:if="${administrator}">
      <legend>SQL engines</legend>
      <label data-ui-engine-setting="kyuubi"><input type="checkbox" data-ui-engine-choice="kyuubi" th:checked="${engineVisibility.get('kyuubi')}"/> Spark SQL</label>
      <label data-ui-engine-setting="kyuubi-flink"><input type="checkbox" data-ui-engine-choice="kyuubi-flink" th:checked="${engineVisibility.get('kyuubi-flink')}"/> Flink SQL</label>
      <label data-ui-engine-setting="trino"><input type="checkbox" data-ui-engine-choice="trino" th:checked="${engineVisibility.get('trino')}"/> Trino</label>
      <label data-ui-engine-setting="starrocks"><input type="checkbox" data-ui-engine-choice="starrocks" th:checked="${engineVisibility.get('starrocks')}"/> StarRocks</label>
    </fieldset>
    <button id="uiSettingsReset" class="btn btn-small" type="button">Restore defaults</button>
  </aside>
<!-- Kerberos ticket countdown. Seeded with the seconds the server had left, so
     it stays correct regardless of any offset in the browser's own clock. At
     zero the script signs the user out. -->
<div id="k8s-ticket-timer" class="k8s-ticket-timer" th:if="${ticketRemainingSeconds != null}"
     th:attr="data-remaining=${ticketRemainingSeconds}, data-logout=@{/logout}">
  <a class="k8s-ticket-signout" th:href="@{/logout}" title="Sign out" aria-label="Sign out">
    <i class="fa fa-sign-out"></i>
  </a>
  <span class="k8s-ticket-divider"></span>
  <i class="fa fa-user"></i>
  <span class="k8s-ticket-user" sec:authentication="name">user</span>
  <span class="k8s-ticket-divider"></span>
  <i class="fa fa-clock-o"></i>
  <span class="k8s-ticket-label">Kerberos ticket</span>
  <span class="k8s-ticket-remaining" id="k8s-ticket-remaining">--:--:--</span>
</div>
</body>
</html>
