<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(app, title, content)">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="'kudos - ' + ${title}">kudos</title>
  <link rel="icon" type="image/png" sizes="64x64" th:href="@{/static/app/brand/favicon-64.png}"/>
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/static/app/brand/favicon-32.png}"/>
  <link rel="stylesheet" th:href="@{/static/desktop/css/roboto.css}"/>
  <link rel="stylesheet" th:href="@{/static/desktop/ext/css/font-awesome.min.css}"/>
  <link rel="stylesheet" th:href="@{/static/desktop/ext/css/cui/cui.css}"/>
  <link rel="stylesheet" th:href="@{/static/desktop/ext/css/cui/bootstrap2.css}"/>
  <link rel="stylesheet" th:href="@{/static/desktop/ext/css/cui/bootstrap-responsive2.css}"/>
  <link rel="stylesheet" th:href="@{/static/desktop/css/hue.css}"/>
  <link rel="stylesheet" th:href="@{/static/app/kudos.css}"/>
  <script th:src="@{/static/app/kudos.js}" defer="defer"></script>
</head>
<body data-ui-mode="old" data-ui-theme="system" data-ui-system-theme="light"
      th:attr="data-app=${app},data-ui-user=${#authentication.name}">
<div class="hue-page">
  <div class="sidebar sidebar-collapsed">
    <div class="sidebar-header">
      <a th:href="@{/editor}" aria-label="KUDOS">
        <img class="sidebar-logo" th:src="@{/static/app/brand/logo-mark.png}" alt="KUDOS"/>
      </a>
    </div>
    <nav class="sidebar-body">
      <div class="sidebar-accordion-item" data-ui-tool="editor" th:if="${features.editor}"
           th:classappend="${app == 'editor'} ? ' sidebar-active'">
        <a class="sidebar-sidebar-item" th:href="@{/editor}" title="Editor" aria-label="Editor">
          <div class="sidebar-sidebar-item-icon"><i class="fa fa-fw fa-code"></i></div>
          <span>Editor</span>
        </a>
      </div>
      <div class="sidebar-accordion-item" data-ui-tool="files" th:if="${features.files}"
           th:classappend="${app == 'filebrowser'} ? ' sidebar-active'">
        <a class="sidebar-sidebar-item" th:href="@{/filebrowser}" title="Files" aria-label="Files">
          <div class="sidebar-sidebar-item-icon"><i class="fa fa-fw fa-files-o"></i></div>
          <span>Files</span>
        </a>
      </div>
      <div class="sidebar-accordion-item" data-ui-tool="ozone" th:if="${features.ozone}"
           th:classappend="${app == 'ozone'} ? ' sidebar-active'">
        <a class="sidebar-sidebar-item" th:href="@{/ozone}" title="Ozone" aria-label="Ozone">
          <div class="sidebar-sidebar-item-icon"><i class="fa fa-fw fa-cloud"></i></div>
          <span>Ozone</span>
        </a>
      </div>
      <div class="sidebar-accordion-item" data-ui-tool="hbase" th:if="${features.hbase}"
           th:classappend="${app == 'hbase'} ? ' sidebar-active'">
        <a class="sidebar-sidebar-item" th:href="@{/hbase}" title="HBase" aria-label="HBase">
          <div class="sidebar-sidebar-item-icon"><i class="fa fa-fw fa-database"></i></div>
          <span>HBase</span>
        </a>
      </div>
      <div class="sidebar-accordion-item" data-ui-tool="jobs" th:if="${features.jobs}"
           th:classappend="${app == 'jobs'} ? ' sidebar-active'">
        <a class="sidebar-sidebar-item" th:href="@{/jobs}" title="Jobs" aria-label="Jobs">
          <div class="sidebar-sidebar-item-icon"><i class="fa fa-fw fa-tasks"></i></div>
          <span>Jobs</span>
        </a>
      </div>
      <div class="sidebar-sidebar-spacer"></div>
      <div class="sidebar-accordion-item"
           th:classappend="${app == 'docs'} ? ' sidebar-active'">
        <a class="sidebar-sidebar-item" th:href="@{/docs}" title="Docs" aria-label="Docs">
          <div class="sidebar-sidebar-item-icon"><i class="fa fa-fw fa-book"></i></div>
          <span>Docs</span>
        </a>
      </div>
    </nav>
  <div class="sidebar-footer">
      <button id="uiSettingsButton" class="sidebar-sidebar-item sidebar-settings-button" type="button"
              title="Interface settings" aria-label="Interface settings" aria-controls="uiSettingsPanel" aria-expanded="false">
        <div class="sidebar-sidebar-item-icon"><i class="fa fa-fw fa-cog"></i></div>
        <span>Settings</span>
      </button>
      <div class="sidebar-accordion-item">
        <a class="sidebar-sidebar-item" th:href="@{/logout}" title="Sign out" aria-label="Sign out">
          <div class="sidebar-sidebar-item-icon"><i class="fa fa-fw fa-sign-out"></i></div>
          <span>Sign out</span>
        </a>
      </div>
      <div class="sidebar-footer-bottom-color-line"></div>
    </div>
  </div>

  <div class="main-page">
    <!-- Optional operator banner from kudos.ui.banner-html; trusted config,
         rendered as-is. Absent when the property is empty. -->
    <div class="k8s-banner" th:if="${bannerHtml != null and !bannerHtml.isEmpty()}"
         th:utext="${bannerHtml}"></div>
    <div class="content-wrapper">
      <div class="page-content" th:insert="${content}"></div>
    </div>
  </div>
  </div>
  <aside id="uiSettingsPanel" class="k8s-ui-settings" role="dialog" aria-label="Interface settings" hidden>
    <div class="k8s-ui-settings-header">
      <strong>Interface settings</strong>
      <button id="uiSettingsClose" class="k8s-ui-settings-close" type="button" aria-label="Close settings">×</button>
    </div>
    <fieldset class="k8s-ui-settings-group">
      <legend>Appearance</legend>
      <div class="k8s-ui-choice-group">
        <button type="button" data-ui-mode-choice="old" aria-pressed="true">Old</button>
        <button type="button" data-ui-mode-choice="modern" aria-pressed="false">Modern</button>
      </div>
    </fieldset>
    <fieldset class="k8s-ui-settings-group">
      <legend>Theme</legend>
      <div class="k8s-ui-choice-group">
        <button type="button" data-ui-theme-choice="light" aria-pressed="false">Light</button>
        <button type="button" data-ui-theme-choice="dark" aria-pressed="false">Dark</button>
        <button type="button" data-ui-theme-choice="system" aria-pressed="true">System</button>
      </div>
      <p class="k8s-ui-theme-preview" aria-live="polite"></p>
    </fieldset>
    <fieldset class="k8s-ui-settings-group">
      <legend>Visible tools</legend>
      <label data-ui-tool-setting="editor"><input type="checkbox" data-ui-tool-choice="editor" checked="checked"/> Editor</label>
      <label data-ui-tool-setting="files"><input type="checkbox" data-ui-tool-choice="files" checked="checked"/> Files</label>
      <label data-ui-tool-setting="ozone"><input type="checkbox" data-ui-tool-choice="ozone" checked="checked"/> Ozone</label>
      <label data-ui-tool-setting="hbase"><input type="checkbox" data-ui-tool-choice="hbase" checked="checked"/> HBase</label>
      <label data-ui-tool-setting="jobs"><input type="checkbox" data-ui-tool-choice="jobs" checked="checked"/> Jobs</label>
    </fieldset>
    <button id="uiSettingsReset" class="btn btn-small" type="button">Restore defaults</button>
  </aside>
<!-- Kerberos ticket countdown. Seeded with the seconds the server had left, so
     it stays correct regardless of any offset in the browser's own clock. At
     zero the script signs the user out. -->
<div id="k8s-ticket-timer" class="k8s-ticket-timer" th:if="${ticketRemainingSeconds != null}"
     th:attr="data-remaining=${ticketRemainingSeconds}, data-logout=@{/logout}">
  <i class="fa fa-user"></i>
  <span class="k8s-ticket-user" sec:authentication="name">user</span>
  <span class="k8s-ticket-divider"></span>
  <i class="fa fa-clock-o"></i>
  <span class="k8s-ticket-label">Kerberos ticket</span>
  <span class="k8s-ticket-remaining" id="k8s-ticket-remaining">--:--:--</span>
</div>
</body>
</html>
