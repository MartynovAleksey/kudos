<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('jobs', 'Flink', ~{:: #content})}">
<body>
<div id="content">
  <nav class="navbar k8s-title-bar nokids">
    <div class="navbar-inner">
      <div class="container-fluid">
        <ul class="nav editor-nav">
          <li class="app-header">
            <i class="fa fa-fw fa-tasks"></i>
            <a th:href="@{/jobs(type='flink')}">Jobs</a>
            <span th:text="' / Flink / ' + ${jid}"> / flink</span>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="k8s-breadcrumbs">
    <a th:href="@{/jobs(type='flink')}"><i class="fa fa-fw fa-arrow-left"></i> Back to jobs</a>
    <a class="k8s-spaced" target="_blank" th:href="${rawUrl}">
      <i class="fa fa-fw fa-external-link"></i> Open in a new tab
    </a>
  </div>

  <!-- The Flink dashboard, proxied through this application so it is served from
       the same origin and behind the same session, framed in the KUDOS chrome. -->
  <iframe id="flinkUi" class="k8s-spark-frame"
          th:src="${frameUrl}"
          title="Flink UI"></iframe>
</div>
</body>
</html>
