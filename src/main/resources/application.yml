spring:
  application.name: kudos
  ldap:
    urls: ${LDAP_URL:ldap://localhost:389}
    base: ${LDAP_BASE:dc=example,dc=org}
    username: ${LDAP_MANAGER_DN:}
    password: ${LDAP_MANAGER_PASSWORD:}
    user-dn-pattern: ${LDAP_USER_DN_PATTERN:uid={0}}
server.error.include-message: always
springdoc.paths-to-match: /api/**
spring.servlet.multipart:
  # The HBase bulk-CSV and cell-upload endpoints accept sizable files; the 1 MB
  # default would reject a modest bulk load.
  max-file-size: 256MB
  max-request-size: 256MB
kudos.cluster:
  webhdfs-url: ${WEBHDFS_URL:http://localhost:9870}
  kyuubi-url: ${KYUUBI_JDBC_URL:jdbc:hive2://localhost:10009/default;auth=KERBEROS;principal=kyuubi/_HOST@EXAMPLE.COM}
  # Internal REST API for session telemetry; this is not a browser UI proxy.
  kyuubi-rest-url: ${KYUUBI_REST_URL:http://localhost:10099}
  hbase-quorum: ${HBASE_ZK_QUORUM:localhost}
  ozone-ofs-uri: ${OZONE_OFS_URI:ofs://omservice/}
  # Ozone's own service configuration, mounted read-only. The ofs:// client
  # needs the cluster's Kerberos principals and addresses from it.
  ozone-conf-dir: ${OZONE_CONF_DIR:/etc/ozone/conf}
  # Spark History Server, read over SPNEGO by the jobs screen.
  spark-history-url: ${SPARK_HISTORY_URL:http://localhost:18080}
  # The ticket is obtained from the password presented at login, so each request
  # carries the Kerberos identity of the user who made it.
  kerberos-principal: ${KERBEROS_PRINCIPAL_TEMPLATE:{user}@EXAMPLE.COM}
kudos.api.enabled: ${KUDOS_API_ENABLED:true}
